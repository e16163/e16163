<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250" role="img" aria-label="A pink flower blooming">
  <defs>
    <g id="petal">
      <path d="M100 98 C 82 92 70 76 72 58 C 74 42 87 31 100 31 C 113 31 126 42 128 58 C 130 76 118 92 100 98 Z"
            fill="#f9a4c6" stroke="#6b3550" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M100 97 C 88 93 79 84 76 72 C 88 78 96 86 100 97 Z" fill="#e97fac"/>
      <ellipse cx="112" cy="48" rx="7" ry="10" fill="#ffd3e3" transform="rotate(20 112 48)"/>
    </g>
  </defs>

  <style>
    @keyframes draw  { from { stroke-dashoffset: 165; } to { stroke-dashoffset: 0; } }
    @keyframes boing { 0%   { transform: scale(0) rotate(-22deg); }
                       55%  { transform: scale(1.18) rotate(5deg); }
                       75%  { transform: scale(.92) rotate(-3deg); }
                       90%  { transform: scale(1.04) rotate(1deg); }
                       100% { transform: scale(1) rotate(0); } }
    @keyframes sway  { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
    @keyframes bob   { 0%,100% { transform: translateY(0) rotate(-2deg); }
                       50%     { transform: translateY(-4px) rotate(2deg); } }

    .stem  { stroke-dasharray: 165; animation: draw .9s ease-out both; }
    .leaf  { animation: boing .6s ease-out both; }
    .l1    { transform-origin: 100px 168px; animation-delay: .6s; }
    .l2    { transform-origin: 100px 196px; animation-delay: .75s; }
    .p     { transform-origin: 100px 98px; animation: boing .55s ease-out both; }
    .core  { transform-origin: 100px 96px; animation: boing .5s ease-out both; animation-delay: 1.65s; }
    .plant { transform-origin: 100px 245px; animation: sway 3.2s 2.1s ease-in-out infinite alternate; }
    .head  { transform-origin: 100px 130px; animation: bob 2.6s 2.1s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .stem,.leaf,.p,.core,.plant,.head { animation: none; }
      .stem { stroke-dashoffset: 0; }
    }
  </style>

  <g class="plant">
    <path class="stem" d="M100 244 C 94 206 108 168 100 128 C 98 116 99 106 100 98"
          fill="none" stroke="#6b3550" stroke-width="13" stroke-linecap="round"/>
    <path class="stem" d="M100 244 C 94 206 108 168 100 128 C 98 116 99 106 100 98"
          fill="none" stroke="#74c47a" stroke-width="7" stroke-linecap="round"/>

    <g class="leaf l1">
      <path d="M100 168 C 78 164 58 170 48 186 C 66 200 92 190 100 168 Z"
            fill="#74c47a" stroke="#6b3550" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M96 172 C 82 176 68 182 56 188" fill="none" stroke="#4e9a55" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g class="leaf l2">
      <path d="M100 196 C 122 192 142 198 152 214 C 134 228 108 218 100 196 Z"
            fill="#74c47a" stroke="#6b3550" stroke-width="4.5" stroke-linejoin="round"/>
      <path d="M104 200 C 118 204 132 210 144 216" fill="none" stroke="#4e9a55" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g class="head">
      <g transform="rotate(4 100 98)">   <use href="#petal" class="p" style="animation-delay:.95s"/></g>
      <g transform="rotate(75 100 98)">  <use href="#petal" class="p" style="animation-delay:1.08s"/></g>
      <g transform="rotate(146 100 98)"> <use href="#petal" class="p" style="animation-delay:1.21s"/></g>
      <g transform="rotate(214 100 98)"> <use href="#petal" class="p" style="animation-delay:1.34s"/></g>
      <g transform="rotate(288 100 98)"> <use href="#petal" class="p" style="animation-delay:1.47s"/></g>

      <g class="core">
        <circle cx="100" cy="96" r="18" fill="#ffc94d" stroke="#6b3550" stroke-width="4.5"/>
        <circle cx="93" cy="89" r="5" fill="#ffe6a3"/>
        <circle cx="106" cy="101" r="2.6" fill="#e0952a"/>
        <circle cx="99" cy="105" r="2" fill="#e0952a"/>
        <circle cx="108" cy="90" r="2.2" fill="#e0952a"/>
      </g>
    </g>
  </g>
</svg>
